name: Build InvoiceKit APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.invoicekit.app",
            "appName": "InvoiceKit",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Create www folder with app
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<html><body><h1>InvoiceKit</h1></body></html>" > www/index.html
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --warning-mode=all
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceKit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: InvoiceKit APK - ${{ steps.date.outputs.date }}
          body: |
            ## ✅ InvoiceKit Android APK

            **How to install on Android:**
            1. Download `app-debug.apk` below
            2. Send to your phone via WhatsApp or Email
            3. Open on Android → tap Install
            4. If blocked: Settings → Security → Allow unknown sources → Install

            **For iPhone:** Open your GitHub Pages link in Safari → Share → Add to Home Screen
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
